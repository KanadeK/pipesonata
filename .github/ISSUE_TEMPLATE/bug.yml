name: Bug report
description: Report a reproducible PipeSonata defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps and a synthetic or redacted fixture.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PipeSonata version
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, private logs, and personal data from this report.
          required: true
