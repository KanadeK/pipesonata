name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which workflow-analysis problem is not handled today?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result rather than a specific implementation.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Primary area
      options:
        - Import and adapters
        - Analysis and diagnostics
        - Visual score
        - Audio mapping
        - Export and reporting
        - Accessibility
    validations:
      required: true
